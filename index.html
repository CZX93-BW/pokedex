<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pokédex</title>

  <link rel="stylesheet" href="./css/styles.css">

  <script src="./js/api/fetchPokemon.js" defer></script>
  <script src="./js/utils/helpers.js" defer></script>
  <script src="./js/render/pokemonTemplates.js" defer></script>
  <script src="./js/render/pokemonDetailTemplates.js" defer></script>
  <script src="./js/render/renderPokemon.js" defer></script>
  <script src="./js/main.js" defer></script>
</head>

<body>
  <header class="pageHeader">
    <div class="contentWrapper">
      <div class="pageHeaderContent">
        <h1>Pokédex</h1>

        <div class="searchBar">
          <input
            id="pokemonSearchInput"
            class="searchInput"
            type="text"
            placeholder="Pokémon suchen...">
          <button onclick="handlePokemonSearchButtonClick()" class="searchButton">
            Suchen
          </button>
        </div>
      </div>
    </div>
  </header>

  <main class="pageMain">
    <div class="contentWrapper">
      <section class="pokemonSection">
        <div id="pokemonStatus" class="pokemonStatus"></div>
        <div id="pokemonList" class="pokemonList"></div>

        <div id="loadMoreWrapper" class="loadMoreWrapper">
          <button onclick="loadMorePokemon()" class="loadMoreButton">
            Mehr laden
          </button>
        </div>
      </section>
    </div>
  </main>

  <footer class="pageFooter">
    <div class="contentWrapper">
      <p>Pokédex Projekt • © Bastian Wollny 2026</p>
    </div>
  </footer>

  <div id="pokemonDialogOverlay" class="pokemonDialogOverlay hidden" onclick="closePokemonDetails()">
    <div id="pokemonDialog" class="pokemonDialog"></div>
  </div>
</body>
</html>
