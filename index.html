<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pokédex</title>
  <link rel="stylesheet" href="./css/styles.css">
  <script src="./js/api/fetchPokemon.js" defer></script>
  <script src="./js/utils/helpers.js" defer></script>
  <script src="./js/render/pokemonTemplates.js" defer></script>
  <script src="./js/render/renderPokemon.js" defer></script>
  <script src="./js/render/pokemonDetailTemplates.js" defer></script>
  <script src="./js/main.js" defer></script>
</head>
<body>
  <header class="pageHeader">
    <div class="contentWrapper">
      <div class="pageHeaderContent">
        <h1>Pokédex</h1>

        <div class="searchBar">
          <input
            id="pokemonSearchInput"
            class="searchInput"
            type="text"
            placeholder="Pokémon suchen..."
            aria-label="Pokémon suchen">
          <button
            class="searchButton"
            type="button"
            onclick="handlePokemonSearchButtonClick()">
            Suchen
          </button>
        </div>
      </div>
    </div>
  </header>

  <main class="pageMain">
    <div class="contentWrapper">
      <section class="pokemonSection">
        <div id="pokemonStatus" class="pokemonStatus"></div>
        <div id="pokemonList" class="pokemonList"></div>
      </section>
    </div>
  </main>

  <div id="pokemonDialogOverlay" class="pokemonDialogOverlay hidden">
    <div id="pokemonDialog" class="pokemonDialog"></div>
  </div>
  <div class="loadMoreWrapper">
  <button class="loadMoreButton" onclick="loadMorePokemon()">
    Mehr laden
  </button>
</div>
</body>
</html>
